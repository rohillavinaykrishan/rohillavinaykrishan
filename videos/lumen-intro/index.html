<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0c0a08;
        --glow: #ffb547;
        --glow-soft: rgba(255, 181, 71, 0.28);
        --ink: #fbf3e6;
        --muted: #b8a993;
        --accent: #ffc970;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage-clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      /* Lamp light: a warm pool that blooms behind the title. */
      #light {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 1500px;
        height: 1500px;
        margin: -750px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--glow-soft) 0%,
          rgba(255, 181, 71, 0.1) 32%,
          rgba(255, 181, 71, 0) 62%
        );
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 120px 160px;
        gap: 28px;
      }
      #title {
        color: var(--ink);
        font-size: 240px;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #rule {
        width: 360px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(255, 201, 112, 0), var(--accent), rgba(255, 201, 112, 0));
      }
      #tagline {
        color: var(--ink);
        font-size: 64px;
        font-weight: 400;
        letter-spacing: -0.015em;
        display: flex;
        gap: 0.28em;
      }
      #tagline .em {
        color: var(--accent);
      }
      #meta {
        margin-top: 24px;
        color: var(--muted);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-clip" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="light"></div>
        <div id="scene">
          <h1 id="title">Lumen</h1>
          <div id="rule"></div>
          <p id="tagline">
            <span class="w">Light</span><span class="w">that</span><span class="w">follows</span
            ><span class="w">your</span><span class="w em">focus.</span>
          </p>
          <p id="meta">The adaptive desk lamp · Coming 2027</p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Hook: the lamp light blooms out of darkness.
      tl.fromTo("#light", { autoAlpha: 0, scale: 0.55 }, { autoAlpha: 1, scale: 1, duration: 2.4, ease: "sine.out" }, 0);

      // Title fades in from a soft blur.
      tl.fromTo(
        "#title",
        { autoAlpha: 0, filter: "blur(18px)", y: 24 },
        { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: 1.8, ease: "power2.out" },
        0.6,
      );
      tl.fromTo(
        "#rule",
        { autoAlpha: 0, scaleX: 0 },
        { autoAlpha: 1, scaleX: 1, duration: 0.9, ease: "power3.out", transformOrigin: "center center" },
        2.1,
      );

      // Build: tagline word reveal.
      tl.fromTo(
        "#tagline .w",
        { autoAlpha: 0, y: 30 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.14 },
        3.3,
      );
      // Punch: the light brightens as "focus." lands.
      tl.to("#light", { scale: 1.12, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.2);
      tl.to("#tagline .em", { textShadow: "0 0 36px rgba(255, 201, 112, 0.75)", duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.2);

      // Resolve: product line, gentle hold, then fade to black.
      tl.fromTo("#meta", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: "power2.out" }, 6.0);
      tl.to("#scene", { scale: 1.02, duration: 3.0, ease: "sine.inOut" }, 6.4);
      tl.to(["#scene", "#light"], { autoAlpha: 0, duration: 0.7, ease: "power2.in" }, 9.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
