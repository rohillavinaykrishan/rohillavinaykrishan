        return { x: XC + r * Math.cos(th), y: cy + r * Math.sin(th) * 0.9, p };
      }
      const SAF = [255, 177, 42], KIW = [255, 243, 220];
      function drawMotes(f) {
        cx.clearRect(0, 0, 2160, 3840);
        if (true) return; /* comp lead: MG2 owns the motes */
        cx.globalCompositeOperation = "lighter";
        for (const m of MOTES) {
          if (f < m.t0) continue;
          const p0 = cl((f - m.t0) / (m.t1 - m.t0), 0, 1);
          if (p0 >= 1) continue;
          const life = Math.min(1, (f - m.t0) / 2);           // 2-frame birth
          // trail: 6 frames back
          for (let k = 6; k >= 0; k--) {
            const ff = f - k * 0.5; if (ff < m.t0) continue;
            const q = moteAt(m, ff, T[Math.max(0, Math.min(N - 1, Math.round(ff)))]);
            const col = SAF.map((c, j) => Math.round(lerp(c, KIW[j], q.p)));
            const al = life * (1 - k / 7) * (k === 0 ? 0.95 : 0.35);
            const rad = m.s * (k === 0 ? 1 : 0.6) * (0.6 + 0.4 * (1 - q.p));
            const g = cx.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);
            g.addColorStop(0, "rgba(" + col + "," + al + ")"); g.addColorStop(1, "rgba(" + col + ",0)");
            cx.fillStyle = g; cx.beginPath(); cx.arc(q.x, q.y, rad, 0, Math.PI * 2); cx.fill();
          }
        }
        cx.globalCompositeOperation = "source-over";
      }

      const grain = $("mg1-grain"), fu = $("mg1-fadeup"), hdr = $("mg1-header");
      function render(fr) {
        const f = Math.max(0, Math.min(N - 1, Math.round(fr)));
        fit();
        // fade-up from aubergine: 3 frames
        fu.style.opacity = f < 3 ? String(0.75 - f * 0.25) : "0";
        // smoke drift
        for (const s of SMOKE) {
          const y = s.y - 3.8 * f, x = s.x + s.sw * Math.sin(f / 70 + s.ph);
          s.el.style.transform = "translate(" + (x - s.w / 2).toFixed(1) + "px," + (y - s.h / 2).toFixed(1) + "px)";
        }
        // grain: new random offset every frame (seeded by frame)
        grain.style.backgroundPosition = Math.floor(hash(f) * 512) + "px " + Math.floor(hash(f + 999) * 512) + "px";
        // panels
        for (const p of PANELS) {
          const st = panelState(p, f);
          if (!st) { p.skew.style.visibility = "hidden"; continue; }
          p.skew.style.visibility = "visible";
          const ins = ((1 - st.a) * 50).toFixed(3);
          p.skew.style.clipPath = "inset(" + ins + "% 0 " + ins + "% 0)";
          p.pos.style.transform = "translateY(" + st.dy.toFixed(1) + "px)";
          const eo = st.edge ? 1 : 0;
          p.e1.style.opacity = eo; p.e2.style.opacity = eo;
          p.e1.style.top = (p.h * (1 - st.a) / 2 - 3) + "px"; p.e2.style.top = (p.h * (1 + st.a) / 2 - 3) + "px";
        }
        // her row
        const yc = T[f];
        // dim ramp: 100% -> 60% (f200-232), -> 22% (f243-249); her right-column cell keeps 100%
        let dim = 1;
        if (f >= 200) dim = lerp(1, 0.6, cl((f - 200) / 32, 0, 1));
        if (f >= 243) dim = lerp(0.6, 0.22, OUT((f - 243 + 1) / 6));
        let cell = 1;              // white roll cell alpha
        let saf = 0;               // MG1 saffron copy alpha
        if (f >= 243 && D.dim_in_mg1) { const u = cl((f - 243 + 1) / 3, 0, 1); saf = u; cell = 1 - u; }
        if (D.dim_in_mg1) {
          // two non-overlapping mask layers: her row band (dim | cell | dim) + the rest of the frame (dim, hole at her row)
          const cy0 = Math.round(yc - 46.5), A = X0 - 20, B = X0 + W0 + 20;
          const d = "rgba(0,0,0," + dim.toFixed(4) + ")", c = "rgba(0,0,0," + cell.toFixed(4) + ")";
          if (dim >= 0.999 && cell >= 0.999) {
            rw.style.webkitMaskImage = rw.style.maskImage = "none";
          } else {
            rw.style.webkitMaskImage = rw.style.maskImage =
              "linear-gradient(to right," + d + " 0px," + d + " " + A + "px," + c + " " + A + "px," + c + " " + B + "px," + d + " " + B + "px), " +
              "linear-gradient(to bottom," + d + " 0px," + d + " " + cy0 + "px,rgba(0,0,0,0) " + cy0 + "px,rgba(0,0,0,0) " + (cy0 + 93) + "px," + d + " " + (cy0 + 93) + "px)";
            rw.style.webkitMaskSize = rw.style.maskSize = "2160px 93px, 2160px 3840px";
            rw.style.webkitMaskPosition = rw.style.maskPosition = "0px " + cy0 + "px, 0px 0px";
            rw.style.webkitMaskRepeat = rw.style.maskRepeat = "no-repeat";
            rw.style.maskComposite = "add"; rw.style.webkitMaskComposite = "source-over";
          }
        }
        hn.style.opacity = saf; hn.style.top = (yc - 46.5).toFixed(2) + "px";
        hdr.style.opacity = f >= 243 ? lerp(1, 0.45, OUT((f - 243 + 1) / 6)) : 1;
        // cursor: enters f200 (6 f, expo-out), tracks her row, lock snap f243, LOCKED f254
        if (f < 200 || f >= 243) cur.style.opacity = "0"; /* comp lead: MG2 owns the cursor f243+ */
        else {
          const ue = OUT((f - 200 + 1) / 6);
          cur.style.opacity = String(ue);
          const top = yc - RH / 2;
          rect.style.transform = "translate(" + (X0 - PAD) + "px," + top.toFixed(2) + "px)";
          let bs = lerp(1.6, 1.25, ue);
          if (D.charge_fx && f >= 243) bs = lerp(1.25, 1.0, OUT((f - 243 + 1) / 6));
          brk.style.transform = "translate(" + (XC - (RW + 24) / 2) + "px," + (yc - (RH + 24) / 2).toFixed(2) + "px) scale(" + bs.toFixed(4) + ")";
          tag.style.transform = "translate(" + (X0 - PAD + lerp(-24, 0, ue)).toFixed(1) + "px," + (top - 50 - 8).toFixed(2) + "px)";
          const locked = D.charge_fx && f >= 254;
          tag.textContent = locked ? "P1 · LOCKED" : "P1 · SELECT";
          tag.style.background = locked ? "#FFF3DC" : "#FFB12A";
        }
        drawMotes(f);
        // push-in 1.00 -> 1.03 (f243-260, ease-in-out), origin = her name cell at rest
        let sc = 1;
        if (D.charge_fx && f >= 243) sc = lerp(1, 1.03, IO((f - 243) / 17));
        cam.style.transformOrigin = XC + "px " + D.stop_y + "px";
        cam.style.transform = "scale(" + sc.toFixed(5) + ")";
      }

      const st = { f: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { f: N, duration: N / 25, ease: "none", onUpdate: () => render(st.f) }, 0);
      render(0);
      window.__timelines["mg1"] = tl;
    })();
  </script>
</template>
