      const O = [1080, 1700];
      const X0 = D.name_x, W0 = D.name_w, XC = X0 + W0 / 2, SY = D.stop_y, PAD = 16;

      const pushS = (F) => F < 243 ? 1 : lerp(1, 1.03, IO(cl01((F - 243) / 17)));

      // ---- cursor geometry ----
      const rect = $("mg2-rect"), brk = $("mg2-brk"), tag = $("mg2-tag"), cur = $("mg2-cursor");
      rect.style.width = RW + "px"; rect.style.height = RH + "px";
      brk.style.width = (RW + 24) + "px"; brk.style.height = (RH + 24) + "px";
      brk.style.transformOrigin = "50% 50%";

      // ---- hero name: rip start state = her roll cell (pushed 1.03) ----
      const S0 = (D.cap / 300) * 1.03;                 // cap-matched start scale
      const RC = [XC, SY];
      const rowtxt = $("mg2-rowtxt");
      const fsL = D.font_px / (D.cap / 300);           // roll font size in hero-local px
      rowtxt.style.fontSize = fsL + "px"; rowtxt.style.lineHeight = (1.219 * fsL) + "px";
      rowtxt.style.left = (O[0] - (W0 / 2) / (D.cap / 300)) + "px";
      rowtxt.style.top = (O[1] - 0.618 * fsL) + "px";
      function nameState(F) {           // centre + scale of the hero block at master frame F (float)

      }
      const xf = (st) => "translate(" + (st.x - O[0]).toFixed(2) + "px," + (st.y - O[1]).toFixed(2) + "px) scale(" + st.s.toFixed(5) + ")";
      const nx = $("mg2-nx"), glow = $("mg2-glow"), fill = $("mg2-fill"), outline = $("mg2-outline");
      // 12-sample motion blur on the scale: 11 ghosts across a half-frame shutter + the crisp main
      const NG = 11, ghosts = [];
      const gh = $("mg2-ghosts");
      for (let k = 1; k <= NG; k++) {
        const g = document.createElement("div");
        g.className = "mg2-nx mg2-ghost"; g.id = "mg2-g" + k;
        g.innerHTML = '<div class="mg2-hl mg2-h1">SUKANYA</div><div class="mg2-hl mg2-h2">DILIP DHARIYA</div>';
        gh.appendChild(g); ghosts.push(g);
      }

      // ---- band ----
      const bandpos = $("mg2-bandpos"), bandmedia = $("mg2-bandmedia");
      const MS = 1.575;                                 // counter-skewed plate scale: covers the visible parallelogram
      bandmedia.style.transform = "skewY(12deg) scale(" + MS + ")";
      function bandX(F) {                               // slam: +2400 -> -72 (3% overshoot) f260->264, settle f264->267

      }
      const bandCY = (x, F) => O[1] - (x - (O[0] + bandX(F))) * TAN;   // band centre line y at frame x

      // ---- shatter cards ----

        el.children[1].style.left = D.rx + "px";

      });
      {
        const r = mul32(2610);
        for (const c of CARDS) {
          const y0 = SY + (c.y - SY) * 1.03;            // pushed position at f261 (MG1 push holds 1.03 at f260)
          const dy = y0 - SY, side = dy === 0 ? (r() < 0.5 ? -1 : 1) : Math.sign(dy);
          const dxr = (r() * 2 - 1) * (Math.abs(dy) * 0.55 + 260);

      // distance travelled (px) after age a seconds: velocity v decaying with an impulse profile (avg ~v over 0.48 s)
      const travel = (v, a) => v * 1.6 * (1 - Math.exp(-3.2 * a)) / 3.2 * 1.25;

      // ---- particles ----
      const fx = $("mg2-fx"), fc = fx.getContext("2d"), mc = $("mg2-motes").getContext("2d");
      const MOTES = [];
      { const r = mul32(261); for (let i = 0; i < 40; i++) MOTES.push({ th: r() * Math.PI * 2, t0: 243 + r() * 4, t1: 258 + r() * 2.0, s: 6 + r() * 8, rr: 0.85 + r() * 0.3 }); }
      function moteAt(m, f) {

        const a = 3.0; const rad = 1100 * m.rr * (Math.exp(-a * e) - Math.exp(-a)) / (1 - Math.exp(-a));

      }
      const SAF = [255, 177, 42], KIW = [255, 243, 220], CIN = [255, 90, 31];
      const mix = (a, b, t) => a.map((c, j) => Math.round(lerp(c, b[j], t)));

      const G = 2200, C = 25 * Math.log(1 / 0.92);      // gravity px/s^2, drag 0.08 per frame
      const SP = [];
      {

            life: 8 + r() * 12, len: 12 + r() * 16, w: 2 + r() * 1.5 });
        }

        r2.setAttribute("r", R2.toFixed(1)); r2g.setAttribute("r", R2.toFixed(1)); r2.setAttribute("opacity", A2.toFixed(3)); r2g.setAttribute("opacity", (A2 * 0.4).toFixed(3));

    })();
