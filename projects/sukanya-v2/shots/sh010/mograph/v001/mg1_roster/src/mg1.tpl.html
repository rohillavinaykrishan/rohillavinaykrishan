  <script>
    (function () {
      const D = /*@@DATA@@*/{};
      const N = D.frames;               // 261 (f0..f260)
      const $ = (id) => document.getElementById(id);
      const stage = $("mg1-stage"), cam = $("mg1-cam");
      // fit the 2160x3840 stage to whatever size the host gives this comp (4K master or 540 proxy)
      function fit() {
        const host = stage.parentElement;
        const w = host.clientWidth || 2160;
        stage.style.transform = "scale(" + (w / 2160) + ")";
      }
      fit();

      // ---- the two eases of the motion language + helpers ----
      function bez(x1, y1, x2, y2) {
        return function (x) {
          if (x <= 0) return 0; if (x >= 1) return 1;
          let t = x;
          for (let i = 0; i < 8; i++) {
            const cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
            const dx = 3 * x1 * (1 - t) * (1 - t) + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
            if (Math.abs(dx) < 1e-6) break; t -= cx / dx; t = Math.min(1, Math.max(0, t));
          }
          return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
        };
      }
      const OUT = bez(0.16, 1, 0.3, 1);     // entrances: ease-out-expo
      const IN = bez(0.7, 0, 0.84, 0);      // exits
      const IO = bez(0.65, 0, 0.35, 1);     // the push-in (camera move)
      const cl = (v, a, b) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      function mul32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      const hash = (n) => mul32(n * 7919 + 17)();

      // ---- background smoke (0.2x of the roll: 3.8 px/frame up, slow sway) ----
      const SMOKE = [
        { id: "mg1-s1", x: 380, y: 900, w: 2200, h: 1500, c: "rgba(74,24,56,0.55)", sw: 60, ph: 0.0 },
        { id: "mg1-s2", x: 1700, y: 1900, w: 2000, h: 1700, c: "rgba(122,46,92,0.30)", sw: 80, ph: 1.7 },
        { id: "mg1-s3", x: 600, y: 2900, w: 2300, h: 1600, c: "rgba(74,24,56,0.50)", sw: 70, ph: 3.1 },
        { id: "mg1-s4", x: 1500, y: 4000, w: 2100, h: 1500, c: "rgba(122,46,92,0.26)", sw: 90, ph: 4.4 },
        { id: "mg1-s5", x: 900, y: 1700, w: 900, h: 700, c: "rgba(255,177,42,0.06)", sw: 40, ph: 2.2 }
      ];
      SMOKE.forEach((s) => { const e = $(s.id); s.el = e; e.style.width = s.w + "px"; e.style.height = s.h + "px";
        e.style.background = "radial-gradient(closest-side, " + s.c + ", rgba(20,8,15,0))"; });

      // ---- panels ----
      const PANELS = D.panels;   // [{id, cy, h, scale, opacity, visits:[{o,c,open,close,closeDy,shots:[{vid,fin,fout}]}]}]
      PANELS.forEach((p) => { p.pos = $(p.id + "-pos"); p.skew = $(p.id + "-skew"); p.e1 = $(p.id + "-e1"); p.e2 = $(p.id + "-e2"); });
      function panelState(p, f) {
        for (const v of p.visits) {
          const end = v.c + v.close;
          if (f < v.o || f >= end) continue;
          let a = 1, dy = 0, edge = 0;
          if (v.open > 0 && f < v.o + v.open) { const u = (f - v.o + 1) / v.open; a = OUT(u); if (v.edge) edge = 1; }
          if (f >= v.c) { const u = (f - v.c + 1) / v.close; a = 1 - IN(u); dy = (v.closeDy || 0) * IN(u); }
          // 0.6x drift: the active shot's window rises at 11.4 px/frame, centred on the shot's mid frame
          let sh = v.shots[0];
          for (const s of v.shots) if (f >= s.fin) sh = s;
          const drift = D.drift * ((sh.fin + sh.fout) / 2 - f);
          return { a, dy: dy + drift, edge };
        }
        return null;
      }

      // ---- her row geometry ----
      const T = D.track;          // her row centre y per frame (roll space)
      const X0 = D.name_x, W0 = D.name_w, CAP = D.cap, PAD = 16;
      const XC = X0 + W0 / 2;
      const hn = $("mg1-hername"); hn.style.left = X0 + "px";
      const rect = $("mg1-rect"), brk = $("mg1-brk"), tag = $("mg1-tag"), cur = $("mg1-cursor");
      const RW = W0 + 2 * PAD, RH = CAP + 2 * PAD;
      rect.style.width = RW + "px"; rect.style.height = RH + "px";
      brk.style.width = (RW + 24) + "px"; brk.style.height = (RH + 24) + "px";
      const rw = $("mg1-rollwrap");

      // ---- ki motes (40, 2-turn spiral, r 1100 -> 0, arrive f258-260, 6-frame additive trails) ----
      const cv = $("mg1-motes"), cx = cv.getContext("2d");
      const MOTES = [];
      { const r = mul32(261); for (let i = 0; i < 40; i++) MOTES.push({ th: r() * Math.PI * 2, t0: 243 + r() * 4, t1: 258 + r() * 2.0,
          s: 6 + r() * 8, rr: 0.85 + r() * 0.3 }); }
      function moteAt(m, f, cy) {
        const p = cl((f - m.t0) / (m.t1 - m.t0), 0, 1); const e = IN(p) * 0.85 + p * 0.15;
        const a = 3.0; const r = 1100 * m.rr * (Math.exp(-a * e) - Math.exp(-a)) / (1 - Math.exp(-a));
        const th = m.th + 4 * Math.PI * e;
        return { x: XC + r * Math.cos(th), y: cy + r * Math.sin(th) * 0.9, p };
      }
      const SAF = [255, 177, 42], KIW = [255, 243, 220];
      function drawMotes(f) {
        cx.clearRect(0, 0, 2160, 3840);
        if (!D.charge_fx || f < 243) return;
        cx.globalCompositeOperation = "lighter";
        for (const m of MOTES) {
          if (f < m.t0) continue;
          const p0 = cl((f - m.t0) / (m.t1 - m.t0), 0, 1);
          if (p0 >= 1) continue;
          const life = Math.min(1, (f - m.t0) / 2);           // 2-frame birth
          // trail: 6 frames back
          for (let k = 6; k >= 0; k--) {
            const ff = f - k * 0.5; if (ff < m.t0) continue;
            const q = moteAt(m, ff, T[Math.max(0, Math.min(N - 1, Math.round(ff)))]);
            const col = SAF.map((c, j) => Math.round(lerp(c, KIW[j], q.p)));
            const al = life * (1 - k / 7) * (k === 0 ? 0.95 : 0.35);
            const rad = m.s * (k === 0 ? 1 : 0.6) * (0.6 + 0.4 * (1 - q.p));
            const g = cx.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);

            cx.fillStyle = g; cx.beginPath(); cx.arc(q.x, q.y, rad, 0, Math.PI * 2); cx.fill();
          }

      }

      const grain = $("mg1-grain"), fu = $("mg1-fadeup"), hdr = $("mg1-header");
      function render(fr) {
        const f = Math.max(0, Math.min(N - 1, Math.round(fr)));
        fit();
        // fade-up from aubergine: 3 frames
        fu.style.opacity = f < 3 ? String(0.75 - f * 0.25) : "0";
        // smoke drift
        for (const s of SMOKE) {
          const y = s.y - 3.8 * f, x = s.x + s.sw * Math.sin(f / 70 + s.ph);
          s.el.style.transform = "translate(" + (x - s.w / 2).toFixed(1) + "px," + (y - s.h / 2).toFixed(1) + "px)";
        }
        // grain: new random offset every frame (seeded by frame)
        grain.style.backgroundPosition = Math.floor(hash(f) * 512) + "px " + Math.floor(hash(f + 999) * 512) + "px";
        // panels
        for (const p of PANELS) {
          const st = panelState(p, f);
          if (!st) { p.skew.style.visibility = "hidden"; continue; }
          p.skew.style.visibility = "visible";
          const ins = ((1 - st.a) * 50).toFixed(3);
          p.skew.style.clipPath = "inset(" + ins + "% 0 " + ins + "% 0)";
          p.pos.style.transform = "translateY(" + st.dy.toFixed(1) + "px)";
          const eo = st.edge ? 1 : 0;
          p.e1.style.opacity = eo; p.e2.style.opacity = eo;
          p.e1.style.top = (p.h * (1 - st.a) / 2 - 3) + "px"; p.e2.style.top = (p.h * (1 + st.a) / 2 - 3) + "px";
        }
        // her row
        const yc = T[f];
        // dim ramp: 100% -> 60% (f200-232), -> 22% (f243-249); her right-column cell keeps 100%
        let dim = 1;
        if (f >= 200) dim = lerp(1, 0.6, cl((f - 200) / 32, 0, 1));
        if (f >= 243) dim = lerp(0.6, 0.22, OUT((f - 243 + 1) / 6));
        let cell = 1;              // white roll cell alpha
        let saf = 0;               // MG1 saffron copy alpha
        if (f >= 243) { const u = cl((f - 243 + 1) / 3, 0, 1); saf = u; cell = 1 - u; }
        if (D.dim_in_mg1) {
          // two non-overlapping mask layers: her row band (dim | cell | dim) + the rest of the frame (dim, hole at her row)
          const cy0 = Math.round(yc - 46.5), A = X0 - 20, B = X0 + W0 + 20;
          const d = "rgba(0,0,0," + dim.toFixed(4) + ")", c = "rgba(0,0,0," + cell.toFixed(4) + ")";
          if (dim >= 0.999 && cell >= 0.999) {
            rw.style.webkitMaskImage = rw.style.maskImage = "none";
          } else {
            rw.style.webkitMaskImage = rw.style.maskImage =
              "linear-gradient(to right," + d + " 0px," + d + " " + A + "px," + c + " " + A + "px," + c + " " + B + "px," + d + " " + B + "px), " +
              "linear-gradient(to bottom," + d + " 0px," + d + " " + cy0 + "px,rgba(0,0,0,0) " + cy0 + "px,rgba(0,0,0,0) " + (cy0 + 93) + "px," + d + " " + (cy0 + 93) + "px)";
            rw.style.webkitMaskSize = rw.style.maskSize = "2160px 93px, 2160px 3840px";
            rw.style.webkitMaskPosition = rw.style.maskPosition = "0px " + cy0 + "px, 0px 0px";
            rw.style.webkitMaskRepeat = rw.style.maskRepeat = "no-repeat";
            rw.style.maskComposite = "add"; rw.style.webkitMaskComposite = "source-over";
          }
        }
        hn.style.opacity = saf; hn.style.top = (yc - 46.5).toFixed(2) + "px";
        hdr.style.opacity = f >= 243 ? lerp(1, 0.45, OUT((f - 243 + 1) / 6)) : 1;
        // cursor: enters f200 (6 f, expo-out), tracks her row, lock snap f243, LOCKED f254
        if (f < 200) cur.style.opacity = "0";
        else {
          const ue = OUT((f - 200 + 1) / 6);
          cur.style.opacity = String(ue);
          const top = yc - RH / 2;
          rect.style.transform = "translate(" + (X0 - PAD) + "px," + top.toFixed(2) + "px)";
          let bs = lerp(1.6, 1.25, ue);
          if (D.charge_fx && f >= 243) bs = lerp(1.25, 1.0, OUT((f - 243 + 1) / 6));
          brk.style.transform = "translate(" + (XC - (RW + 24) / 2) + "px," + (yc - (RH + 24) / 2).toFixed(2) + "px) scale(" + bs.toFixed(4) + ")";
          tag.style.transform = "translate(" + (X0 - PAD + lerp(-24, 0, ue)).toFixed(1) + "px," + (top - 50 - 8).toFixed(2) + "px)";
          const locked = D.charge_fx && f >= 254;
          tag.textContent = locked ? "P1 · LOCKED" : "P1 · SELECT";
          tag.style.background = locked ? "#FFF3DC" : "#FFB12A";
        }
        drawMotes(f);
        // push-in 1.00 -> 1.03 (f243-260, ease-in-out), origin = her name cell at rest
        let sc = 1;
        if (D.charge_fx && f >= 243) sc = lerp(1, 1.03, IO((f - 243) / 17));
        cam.style.transformOrigin = XC + "px " + D.stop_y + "px";
        cam.style.transform = "scale(" + sc.toFixed(5) + ")";
      }

      const st = { f: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { f: N, duration: N / 25, ease: "none", onUpdate: () => render(st.f) }, 0);
      render(0);
      window.__timelines["mg1"] = tl;
    })();
  </script>
