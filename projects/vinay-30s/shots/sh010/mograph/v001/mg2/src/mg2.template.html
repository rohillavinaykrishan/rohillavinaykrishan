<template>
  <!-- MG2 SPECTRUM STRIKE (treatment section 6). Generated by build.py from this template:
       timing from director/v001/cues.json, name geometry from ../name_layout.json.
       Timeline clock = MASTER seconds (mount this scene at data-start="0").
       Paints only f336-f386; transparent elsewhere. Stage is designed at 2160x3840 and
       scales to whatever size the host gives it (4K master, 540 proxy). -->
  <style>
    @font-face {
      font-family: "Unbounded";
      font-weight: 900;
      src: url("assets/fonts/Unbounded-900.ttf") format("truetype");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    #mg2-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 2160px;
      height: 3840px;
      transform-origin: 0 0;
    }
    #mg2-win {
      position: absolute;
      left: __WIN_X__px;
      top: __WIN_Y__px;
      width: __WIN_W__px;
      height: __WIN_H__px;
      overflow: hidden;
      clip-path: inset(50% 0 50% 0);
      z-index: 1;
    }
    #mg2-h0 {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mg2-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 2160px;
      height: 3840px;
    }
    #mg2-fx { z-index: 2; }
    #mg2-name { z-index: 3; }
  </style>
  <div id="root" data-composition-id="mg2" data-width="2160" data-height="3840" data-layout-allow-overflow data-layout-ignore>
    <div id="mg2-stage">
      <div id="mg2-win">
        <video id="mg2-h0" class="clip" data-start="__H0_START__" data-duration="__H0_DUR__" data-track-index="1" src="__H0_SRC__" muted playsinline></video>
      </div>
      <canvas id="mg2-fx" class="mg2-cv"></canvas>
      <canvas id="mg2-name" class="mg2-cv"></canvas>
    </div>
  </div>
  <script>
/* ---- FX kit (inlined by build.py from ../kit/kit.js) ---- */
__KIT__
  </script>
  <script>
    (function () {
      const L = __LAYOUT__;
      const Q = __CUES__;
      const FPS = Q.fps, HIT = Q.hit, F0 = Q.charge[0], CH1 = Q.charge[1], S0 = Q.silence[0], S1 = Q.silence[1], FEND = Q.end;
      const CX = L.name_centre[0], CY = L.name_centre[1];
      const WHITE = Q.pal.white, GOLD = Q.pal.gold, GOLDD = Q.pal.goldDeep, HUES = Q.hues;
      const DRAW_CHARGE = Q.drawCharge;
      const W4 = 2160, H4 = 3840;

      // ---- the two motion-spec eases (kit.js if present, else identical local copies) ----
      function bez(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const sx = (u) => ((ax * u + bx) * u + cx) * u, sy = (u) => ((ay * u + by) * u + cy) * u;
        const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
        return (t) => {
          if (t <= 0) return 0; if (t >= 1) return 1;
          let u = t;
          for (let i = 0; i < 8; i++) { const e = sx(u) - t, d = dx(u); if (Math.abs(e) < 1e-6) break; if (Math.abs(d) < 1e-6) break; u -= e / d; }
          if (u < 0 || u > 1 || Math.abs(sx(u) - t) > 1e-4) { let a = 0, b = 1; u = t; for (let i = 0; i < 40; i++) { if (sx(u) < t) a = u; else b = u; u = (a + b) / 2; } }
          return sy(u);
        };
      }
      const EOUT = bez(0.16, 1, 0.3, 1);   // entrances
      const EIN = bez(0.7, 0, 0.84, 0);    // exits
      const SINE = (p) => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, p)))) / 2;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const prog = (f, a, b) => clamp((f - a) / (b - a));
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
      function rgba(hex, a) { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
      function mix(h1, h2, k) { const a = rgb(h1), b = rgb(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(",")})`; }

      // ray k: 22.5 + 45k degrees clockwise from 12 o'clock (Ryu first)
      const DIRS = HUES.map((_, k) => { const a = ((22.5 + 45 * k) * Math.PI) / 180; return [Math.sin(a), -Math.cos(a), a]; });

      // ---- stage scaling: designed at 2160x3840, fitted to the host ----
      const root = document.querySelector('[data-composition-id="mg2"]');
      const stage = document.getElementById("mg2-stage");
      const win = document.getElementById("mg2-win");
      const host = root.closest('[data-composition-src]') || root.parentElement;
      const hostW = parseFloat((host && host.getAttribute("data-width")) || "") || window.innerWidth || W4;
      const S = Math.min(hostW, window.innerWidth || hostW) / W4;
      stage.style.transform = `scale(${S})`;
      const PX = S * (window.devicePixelRatio || 1);   // backing pixels per 4K px
      function mkCanvas(el) { const c = el || document.createElement("canvas"); c.width = Math.round(W4 * PX); c.height = Math.round(H4 * PX); return c; }
      const fxC = mkCanvas(document.getElementById("mg2-fx")), nmC = mkCanvas(document.getElementById("mg2-name"));
      const fx = fxC.getContext("2d"), nm = nmC.getContext("2d");
      const tmpC = mkCanvas(), tmp = tmpC.getContext("2d");
      const glowC = mkCanvas(), glow = glowC.getContext("2d");
      const reset = (c) => { c.setTransform(PX, 0, 0, PX, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none"; };

      // ---- the name, glyph by glyph from name_layout.json ----
      const FONT = `900 ${L.font.size_px}px Unbounded`;
      function nameAt(c, sc, ox, oy, mode) {
        c.save();
        c.translate(CX + ox, CY + oy); c.scale(sc, sc); c.translate(-CX, -CY);
        c.font = FONT; c.textBaseline = "alphabetic"; c.textAlign = "left";
        for (const ln of L.lines) for (const g of ln.glyphs) {
          if (mode === "stroke") c.strokeText(g.ch, g.pen_x, ln.baseline_y);
          else if (mode === "both") { c.strokeText(g.ch, g.pen_x, ln.baseline_y); c.fillText(g.ch, g.pen_x, ln.baseline_y); }
          else c.fillText(g.ch, g.pen_x, ln.baseline_y);
        }
        c.restore();
      }
      // blurred copy of the name (glow), cached per (scale, colour, radius, stroke)
      const cache = new Map();
      function glowName(sc, colour, blur, stroke) {
        const key = [sc.toFixed(4), colour, blur, stroke].join("|");
        if (cache.has(key)) return cache.get(key);
        reset(tmp); tmp.clearRect(0, 0, W4, H4);
        tmp.fillStyle = colour; tmp.strokeStyle = colour; tmp.lineWidth = stroke; tmp.lineJoin = "round";
        nameAt(tmp, sc, 0, 0, stroke > 0 ? "both" : "fill");
        const out = mkCanvas(), o = out.getContext("2d");
        o.filter = `blur(${blur * PX}px)`; o.drawImage(tmpC, 0, 0);
        if (cache.size > 40) cache.clear();
        cache.set(key, out); return out;
      }

      // ---- master scale of the White Hot copy: 1.35 -> 1.00 (f365-370, with a 4% undershoot) -> settle f374 ----
      function nameScale(f) {
        if (f < HIT) return 1.35;
        if (f < HIT + 5) return 1.35 + (0.96 - 1.35) * EOUT(prog(f, HIT, HIT + 5));
        if (f < HIT + 9) return 0.96 + 0.04 * SINE(prog(f, HIT + 5, HIT + 9));
        return 1;
      }
      const copyOff = (f) => 140 * (1 - EOUT(prog(f, HIT, HIT + 8)));

      // ---- charge spirals (f336-356): 2-turn log spirals r 1300 -> 40, landing on the ray angles ----
      const CW = [14, 8, 11, 6, 12, 9, 13, 7];
      function spiralU(f) { const p = prog(f, F0, CH1); return 0.45 * p + 0.55 * EIN(p); }
      function spiralPt(u, k) { const r = 1300 * Math.pow(40 / 1300, u); const a = DIRS[k][2] - 2 * 2 * Math.PI * (1 - u); return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; }
      function drawCharge(f) {
        const push = 1 + 0.04 * prog(f, F0, CH1);
        fx.save(); fx.translate(CX, CY); fx.scale(push, push); fx.translate(-CX, -CY);
        fx.globalCompositeOperation = "lighter"; fx.lineCap = "butt";
        const uh = spiralU(f), ut = spiralU(f - 10), N = 48;
        for (let k = 0; k < 8; k++) {
          for (let pass = 0; pass < 2; pass++) {
            let prev = spiralPt(ut, k);
            for (let i = 1; i <= N; i++) {
              const q = i / N, u = ut + (uh - ut) * q, pt = spiralPt(u, k);
              const w = CW[k] * (0.25 + 0.75 * q) * (pass ? 4 : 1);
              fx.strokeStyle = pass ? rgba(HUES[k], 0.16 * q) : (q > 0.9 ? mix(HUES[k], WHITE, (q - 0.9) * 8) : HUES[k]);
              fx.globalAlpha = pass ? 1 : 0.25 + 0.75 * q;
              fx.lineWidth = w; fx.beginPath(); fx.moveTo(prev[0], prev[1]); fx.lineTo(pt[0], pt[1]); fx.stroke(); prev = pt;
            }
          }
          const h = spiralPt(uh, k); fx.globalAlpha = 1;
          FX.glow(fx, h[0], h[1], 70, HUES[k], 0.7); FX.glow(fx, h[0], h[1], 18, WHITE, 0.95);
        }
        fx.restore();
      }

      // ---- the White Hot point (silence f357-364) ----
      function drawPoint(f, sc, alpha) {
        if (KIT && KIT.lightPoint) { KIT.lightPoint(fx, CX, CY, Math.round(f), { scale: sc, s: 1 }); return; }
        fx.save(); fx.translate(CX, CY); fx.scale(sc, sc); fx.globalAlpha = alpha;
        let g = fx.createRadialGradient(0, 0, 0, 0, 0, 80);
        g.addColorStop(0, rgba(WHITE, 0.55)); g.addColorStop(0.3, rgba(WHITE, 0.18)); g.addColorStop(1, rgba(WHITE, 0));
        fx.fillStyle = g; fx.beginPath(); fx.arc(0, 0, 80, 0, 7); fx.fill();
        const rot = ((15 * Math.round(f - S0)) * Math.PI) / 180;   // 15 deg per frame
        fx.lineWidth = 6;
        for (let k = 0; k < 8; k++) {
          const a0 = rot + DIRS[k][2] - Math.PI / 2 - Math.PI / 8, a1 = a0 + Math.PI / 4;
          fx.strokeStyle = HUES[k]; fx.beginPath(); fx.arc(0, 0, 15, a0, a1); fx.stroke();
        }
        g = fx.createRadialGradient(0, 0, 0, 0, 0, 13);
        g.addColorStop(0, WHITE); g.addColorStop(0.8, WHITE); g.addColorStop(1, rgba(WHITE, 0));
        fx.fillStyle = g; fx.beginPath(); fx.arc(0, 0, 13, 0, 7); fx.fill();
        fx.restore();
      }

      // ---- sparks: 220 from the 8 ray roots, deterministic sim (gravity 1800 px/s^2, drag 0.08/f) ----
      const rnd = mulberry32(365220);
      const SPARKS = [];
      for (let i = 0; i < 220; i++) {
        const k = i % 8, d = DIRS[k], spread = (rnd() - 0.5) * 0.6, a = d[2] + spread;
        const r0 = 30 + rnd() * 340, sp = 28 + rnd() * 80;
        const born = HIT + rnd() * 2.5;
        SPARKS.push({ k, born, life: Math.min(8 + rnd() * 12, FEND - 1 - born),
          x: CX + d[0] * r0 + (rnd() - 0.5) * 30, y: CY + d[1] * r0 + (rnd() - 0.5) * 30,
          vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, w: 2.5 + rnd() * 4 });
      }
      const GRAV = 1800 / (FPS * FPS), DRAG = 0.08;
      function sparkPos(s, age) {
        let x = s.x, y = s.y, vx = s.vx, vy = s.vy; const st = 0.25, n = Math.max(0, Math.round(age / st));
        const dg = Math.pow(1 - DRAG, st);
        for (let i = 0; i < n; i++) { x += vx * st; y += vy * st; vx *= dg; vy = vy * dg + GRAV * st; }
        return [x, y];
      }
      // kit sparks (FX.sparks): 220 from the 8 ray roots, hue -> White Hot core, gravity 1800, drag 0.08
      const KIT = window.FX && window.FX.sparks ? window.FX : null;
      const SPARK_ORIGINS = [];
      for (let k = 0; k < 8; k++) for (const r0 of [50, 170, 320]) SPARK_ORIGINS.push({ x: CX + DIRS[k][0] * r0, y: CY + DIRS[k][1] * r0, hex: HUES[k], dir: DIRS[k][2] - Math.PI / 2, spread: 0.7 });
      function drawSparks(f) {
        if (KIT) { KIT.sparks(fx, f, { f0: HIT, emit: 2, origins: SPARK_ORIGINS, count: 220, seed: 365, life: [8, Math.min(20, FEND - HIT - 3)], s: 1 }); return; }
        fx.save(); fx.globalCompositeOperation = "lighter"; fx.lineCap = "round";
        for (const s of SPARKS) {
          const age = f - s.born; if (age < 0 || age > s.life) continue;
          const lf = age / s.life, a = 1 - lf * lf;
          const p1 = sparkPos(s, age), p0 = sparkPos(s, Math.max(0, age - 0.8));
          const g = fx.createLinearGradient(p0[0], p0[1], p1[0], p1[1]);
          g.addColorStop(0, rgba(HUES[s.k], 0)); g.addColorStop(0.5, rgba(HUES[s.k], a)); g.addColorStop(1, rgba(WHITE, a));
          fx.strokeStyle = g; fx.lineWidth = s.w * (1 - 0.5 * lf);
          fx.beginPath(); fx.moveTo(p0[0], p0[1]); fx.lineTo(p1[0], p1[1]); fx.stroke();
          fx.strokeStyle = rgba(HUES[s.k], 0.25 * a); fx.lineWidth = s.w * 4;
          fx.beginPath(); fx.moveTo(p0[0], p0[1]); fx.lineTo(p1[0], p1[1]); fx.stroke();
        }
        fx.restore();
      }

      // ---- hue rays + shockwave + detonation ----
      function drawRays(f, sh) {
        const s = f - HIT, len = 2600 * EOUT(clamp(s / 6)), al = 1 - EIN(prog(f, HIT + 3, HIT + 15));
        if (al <= 0 || len <= 1) return;
        // glow pass (120 px), blurred once for all 8
        reset(glow); glow.clearRect(0, 0, W4, H4); glow.globalCompositeOperation = "lighter"; glow.lineCap = "round";
        for (let k = 0; k < 8; k++) {
          const d = DIRS[k], tx = CX + d[0] * len, ty = CY + d[1] * len;
          const g = glow.createLinearGradient(CX, CY, tx, ty);
          g.addColorStop(0, rgba(HUES[k], 0.75)); g.addColorStop(0.5, rgba(HUES[k], 0.4)); g.addColorStop(1, rgba(HUES[k], 0));
          glow.strokeStyle = g; glow.lineWidth = 120; glow.beginPath(); glow.moveTo(CX, CY); glow.lineTo(tx, ty); glow.stroke();
        }
        fx.save(); fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalCompositeOperation = "lighter"; fx.globalAlpha = al;
        fx.filter = `blur(${28 * PX}px)`; fx.drawImage(glowC, sh * PX, -sh * 0.6 * PX); fx.restore();
        // cores (18 px, tapering), hue with a White Hot root
        fx.save(); fx.globalCompositeOperation = "lighter"; fx.globalAlpha = al;
        for (let k = 0; k < 8; k++) {
          const d = DIRS[k], nx = -d[1], ny = d[0], tx = CX + d[0] * len, ty = CY + d[1] * len;
          const g = fx.createLinearGradient(CX, CY, tx, ty);
          g.addColorStop(0, WHITE); g.addColorStop(0.08, mix(HUES[k], WHITE, 0.5)); g.addColorStop(0.2, HUES[k]); g.addColorStop(0.75, rgba(HUES[k], 0.7)); g.addColorStop(1, rgba(HUES[k], 0));
          fx.fillStyle = g; fx.beginPath();
          fx.moveTo(CX + nx * 9, CY + ny * 9); fx.lineTo(tx + nx * 2, ty + ny * 2); fx.lineTo(tx - nx * 2, ty - ny * 2); fx.lineTo(CX - nx * 9, CY - ny * 9); fx.closePath(); fx.fill();
        }
        fx.restore();
      }
      function drawShock(f) {
        const s = f - HIT; if (s < 0 || s >= 10) return;
        const p = s / 10, r = 2400 * EOUT(p), a = Math.pow(1 - p, 1.4);
        fx.save(); fx.globalCompositeOperation = "lighter";
        fx.strokeStyle = rgba(WHITE, 0.14 * a); fx.lineWidth = 18; fx.beginPath(); fx.arc(CX, CY, Math.max(0, r - 14), 0, 7); fx.stroke();
        fx.strokeStyle = rgba(WHITE, 0.07 * a); fx.lineWidth = 60; fx.beginPath(); fx.arc(CX, CY, Math.max(0, r - 40), 0, 7); fx.stroke();
        fx.strokeStyle = rgba(WHITE, a); fx.lineWidth = 4; fx.beginPath(); fx.arc(CX, CY, r, 0, 7); fx.stroke();
        fx.restore();
      }
      function drawBurst(f) {
        const s = f - HIT; if (s < 0 || s > 5) return;
        const a = 1 - EOUT(s / 5), r = 420 + 500 * EOUT(s / 5);
        if (window.FX && window.FX.glow) { FX.glow(fx, CX, CY, r, WHITE, a); FX.glow(fx, CX, CY, r * 0.3, WHITE, a); return; }
        fx.save(); fx.globalCompositeOperation = "lighter";
        const g = fx.createRadialGradient(CX, CY, 0, CX, CY, r);
        g.addColorStop(0, rgba(WHITE, a)); g.addColorStop(0.15, rgba(WHITE, 0.6 * a)); g.addColorStop(1, rgba(WHITE, 0));
        fx.fillStyle = g; fx.fillRect(CX - r, CY - r, 2 * r, 2 * r); fx.restore();
      }

      // ---- name layer: gold glow, keyline, spectral rim, 8 hue copies (additive), White Hot master ----
      function rimGradient(c) {
        const g = c.createConicGradient(-Math.PI / 2, CX, CY), mid = mix(HUES[7], HUES[0], 0.5);
        g.addColorStop(0, mid);
        HUES.forEach((h, k) => g.addColorStop((22.5 + 45 * k) / 360, h));
        g.addColorStop(1, mid); return g;
      }
      function drawName(f) {
        if (f < HIT) return;
        const sc = nameScale(f);
        const gold = SINE(prog(f, HIT + 9, FEND));           // rim cools to gold, complete at f386
        const heat = 1 - EOUT(prog(f, HIT, HIT + 12));        // white-hot bloom while forming
        // gold glow: outer 36 px, 45%
        if (gold > 0) { nm.save(); nm.setTransform(1, 0, 0, 1, 0, 0); nm.globalAlpha = 0.45 * gold; nm.drawImage(glowName(sc, GOLD, 18, 10), 0, 0); nm.globalAlpha = 0.3 * gold; nm.drawImage(glowName(sc, GOLD, 36, 10), 0, 0); nm.restore(); }
        // white-hot bloom
        if (heat > 0.01) { nm.save(); nm.setTransform(1, 0, 0, 1, 0, 0); nm.globalCompositeOperation = "lighter"; nm.globalAlpha = 0.85 * heat; nm.drawImage(glowName(sc, WHITE, 40, 0), 0, 0); nm.restore(); }
        // Gold Deep keyline (2 px, offset 0,+6)
        if (gold > 0) { nm.save(); nm.globalAlpha = gold; nm.fillStyle = GOLDD; nm.strokeStyle = GOLDD; nm.lineWidth = 4; nm.lineJoin = "round"; nameAt(nm, sc, 0, 6, "both"); nm.restore(); }
        // spectral rim: 5 px outer, hue gradient around the letters, from f373, cooling into gold
        const rimA = EOUT(prog(f, HIT + 7, HIT + 9)) * (1 - gold);
        if (rimA > 0.003) { nm.save(); nm.globalAlpha = rimA; nm.strokeStyle = rimGradient(nm); nm.lineWidth = 10; nm.lineJoin = "round"; nameAt(nm, sc, 0, 0, "stroke"); nm.restore(); }
        // 8 coloured copies collapsing along their rays, additive 85%, 8-sample motion blur (half-frame shutter)
        const copyA = 0.85 * (1 - prog(f, HIT + 8, HIT + 11));
        if (copyA > 0) {
          nm.save(); nm.globalCompositeOperation = "lighter";
          for (let k = 0; k < 8; k++) {
            nm.fillStyle = HUES[k];
            for (let j = 0; j < 8; j++) {
              const fs = f - (j / 8) * 0.5, off = copyOff(fs), scs = nameScale(fs);
              nm.globalAlpha = copyA / 8 * 1.0;
              nameAt(nm, scs, DIRS[k][0] * off, DIRS[k][1] * off, "fill");
            }
          }
          nm.restore();
        }
        // White Hot master
        const ma = EOUT(prog(f, HIT - 0.5, HIT + 4));
        nm.save(); nm.globalAlpha = ma; nm.fillStyle = WHITE; nameAt(nm, sc, 0, 0, "fill"); nm.restore();
      }

      // ---- footage window slam (y 2280-3184), 0 px line -> full in 3 f, contact on f365 ----
      const SHAKE = { 0: 14, 1: -8, 2: 4, 3: -2 };
      function shakeAt(f) { const s = Math.floor(f - HIT + 1e-6); return SHAKE[s] || 0; }

      function render(t) {
        const f = t * FPS + 1e-6;
        reset(fx); fx.clearRect(0, 0, W4, H4); reset(nm); nm.clearRect(0, 0, W4, H4);
        const sh = f >= HIT ? shakeAt(f) : 0;
        // window
        const wo = EOUT(prog(f, HIT - 1, HIT + 2));
        const ins = ((1 - wo) * 50).toFixed(3);
        win.style.clipPath = f >= HIT - 1 && f < FEND + 1 ? `inset(${ins}% 0 ${ins}% 0)` : "inset(50% 0 50% 0)";
        win.style.transform = `translate(${sh}px, ${-sh * 0.6}px)`;
        if (f < F0 || f >= FEND + 1) return;
        if (f < CH1 + 1) { if (DRAW_CHARGE) drawCharge(f); return; }
        if (f < HIT) { drawPoint(f, 1 + 0.15 * SINE(prog(f, S0, S1)), 1); return; }
        // strike
        fx.save(); fx.translate(sh, -sh * 0.6); drawRays(f, sh); fx.restore();
        drawBurst(f); drawShock(f); drawSparks(f);
        // window edge flare while it slams open
        if (wo < 1 && f < HIT + 3) {
          const half = __WIN_H__ / 2 * wo, yc = __WIN_Y__ + __WIN_H__ / 2, ea = 1 - prog(f, HIT, HIT + 3);
          fx.save(); fx.translate(sh, -sh * 0.6); fx.globalCompositeOperation = "lighter"; fx.fillStyle = rgba(WHITE, ea);
          fx.fillRect(0, yc - half - 2, W4, 4); fx.fillRect(0, yc + half - 2, W4, 4); fx.restore();
        }
        drawName(f);
        // full-frame White Hot flash: f365 80%, f366 35%, f367 0
        const fi = Math.floor(f - HIT), fl = fi === 0 ? 0.8 : fi === 1 ? 0.35 : 0;
        if (fl > 0) { nm.save(); nm.setTransform(1, 0, 0, 1, 0, 0); nm.globalAlpha = fl; nm.fillStyle = WHITE; nm.fillRect(0, 0, nmC.width, nmC.height); nm.restore(); }
      }

      const DUR = Q.duration_s;
      const state = { t: 0 };
      document.fonts.load(FONT).then(() => {
        const tl = gsap.timeline({ paused: true });
        tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);
        render(0);
        window.__timelines["mg2"] = tl;
      });
    })();
  </script>
</template>
