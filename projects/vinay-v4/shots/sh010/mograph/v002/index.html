          if (F >= 224 && fold === 0) {
            const cam = bandCam(s, x2, BD_TOP[1], KB); const clip = [x2, BD_TOP[1], W, 904];
            drawGrid(cam, 0.9, 46, 3, clip);
            drawTracks(s, x2, BD_TOP[1], KB, 0.9, 1.0, clip);
            const zf = s <= 4 ? 5 * (1 - (s / 4) * (s / 4)) : 0;
            drawWire(cam, 1, zf, 1, clip);
          }
        } else {
          for (let i = 0; i < 4; i++) { S(bands[i], "opacity", "0"); S(labs[i], "opacity", "0"); }
          S(E.bl0, "opacity", "0"); S(E.b4edge, "opacity", "0");
        }

        // ---------------------------------------------------------------- ACT 6: TITLE (f275-374)
        if (act === 6) {
          S(E.title, "opacity", "1");
          const sf = F <= 290 ? lerp(1.06, 1.0, eOC(ramp(F, 275, 290))) : lerp(1.0, 1.03, eIOS(ramp(F, 290, 374)));
          const sb = lerp(1.0, 1.012, ramp(F, 275, 374));
          S(E.tFg, "transform", `scale(${sf.toFixed(5)})`); S(E.tBg, "transform", `scale(${sb.toFixed(5)})`);
          // logo: one technique - a soft left-to-right mask wipe, settling 0.985 -> 1 (never above 1)
          const lg = eOC(ramp(F, 283, 291));                       // clean 8-frame fade with a 12 px rise; the rim glow follows 2 frames later
          S(E.logoBox, "opacity", lg.toFixed(3));
          S(E.logoBox, "transform", `translateY(${lerp(12, 0, lg).toFixed(2)}px)`);
          S($("logoGlowT"), "opacity", (0.3 * eOC(ramp(F, 285, 293))).toFixed(3));
          const rl = eOC(ramp(F, 291, 299));
          S(E.tRule, "opacity", F >= 291 ? "1" : "0"); S(E.tRule, "transform", `scaleX(${rl.toFixed(4)})`);
          const ro = eOC(ramp(F, 292, 302));
          S(E.tRole, "opacity", ro.toFixed(3)); S(E.tRole, "transform", `translateY(${lerp(24, 0, ro).toFixed(2)}px)`);
          const so = eOC(ramp(F, 302, 312));                     // STREET FIGHTER · DNEG on the f302 attack (editor cue fix)
          S(E.tStudio, "opacity", so.toFixed(3)); S(E.tStudio, "transform", `translateY(${lerp(18, 0, so).toFixed(2)}px)`);
        } else S(E.title, "opacity", "0");
        S(E.flash, "opacity", F === 275 ? "0.5" : F === 276 ? "0.25" : "0");

        const rnd = mulberry32(F * 7919 + 13);
        S(E.grain, "transform", `translate(${Math.floor(rnd() * 256)}px,${Math.floor(rnd() * 256)}px)`);
      }

      // ---------------- timeline ----------------
      let BL0W = 0;
      function boot() {
        buildBrush(); BL0W = E.bl0.offsetWidth;
        const drv = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(drv, { t: 15, duration: 15, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      const imgs = Array.from(document.images).map((im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()));
      const faces = ['500 40px "Inter Tight"', '600 40px "Inter Tight"', '700 40px "Inter Tight"', '800 40px "Inter Tight"', '500 36px "JetBrains Mono"', '600 36px "JetBrains Mono"']
        .map((f) => document.fonts.load(f));
      Promise.all([...faces, ...imgs]).then(() => document.fonts.ready).then(boot);
    </script>
  </body>
