            `MEAN REPROJ <b>${Number(ST.mean_reproj_px).toFixed(3)} px</b>   f <b>${ST.f_px} px</b>\n` +

            (F >= 159 ? `\n<span class="p">REGISTER s00 → PLATE</span>` : ""));
          S(E.hudSolve, "opacity", (ramp(F, 137, 140) * (1 - ramp(F, 166, 169))).toFixed(3));
        } else {
          S(E.planeA, "opacity", "0"); S(E.planeB, "opacity", "0"); S(E.act2, "opacity", "0"); S(E.hudSolve, "opacity", "0");
        }

        // ---------------------------------------------------------------- ACT 4: FINAL (f169-220)
        let jolt = 0;
        if (F === 173) jolt = 8; else if (F === 174) jolt = -4.5; else if (F === 175) jolt = 2;
        if (act === 4) {
          const s = F - 169; const A = ANC[s]; const cxp = A.crop_cx;
          const left = 1080 - cxp * KF;
          S(E.finalBox, "opacity", "1"); S(E.finalBox, "transform", `translateY(${jolt}px)`);
          S(E.finalV, "transform", `translateX(${left.toFixed(2)}px)`);
          const mx = (u) => left + u * KF, my = (v) => FIN_TOP + jolt + v * KF;
          // the mark "+" at the plinth's front centre; 1-frame pink halo on the landing
          const fl = A.corners.front_left, fr = A.corners.front_right;
          const bxp = mx((fl[0] + fr[0]) / 2), byp = my((fl[1] + fr[1]) / 2);
          if (F === 173) { const g = ctx.createRadialGradient(bxp, byp, 0, bxp, byp, 120); g.addColorStop(0, "rgba(255,46,136,0.35)"); g.addColorStop(1, "rgba(255,46,136,0)");
            ctx.fillStyle = g; ctx.fillRect(bxp - 120, byp - 120, 240, 240); }
          const pA = 1 - ramp(F, 182, 190);
          if (pA > 0) plus(bxp, byp, F === 173 ? 24 : 16, F === 173 ? 6 : 4, `rgba(255,46,136,${pA.toFixed(3)})`);
          // + LOCKED tag pinned to the plinth's front-left corner (f208)
          if (F >= 208) {
            const k = eOExpo(ramp(F, 208, 213));
            const qx = mx(fl[0]), qy = my(fl[1]);
            plus(qx, qy, 14, 4, PINK);
            const lx = qx - 40, ly = qy - 120;
            ctx.strokeStyle = PINK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(lerp(qx, lx, k), lerp(qy, ly, k)); ctx.stroke();
            S(E.lockTag, "transform", `translate(${(lx - 8).toFixed(1)}px,${(ly - 66).toFixed(1)}px) scale(${lerp(1.18, 1, k).toFixed(3)})`);
            S(E.lockTag, "opacity", ramp(F, 208, 210).toFixed(3));
          } else S(E.lockTag, "opacity", "0");
          S(E.act3, "opacity", ramp(F, 169, 172).toFixed(3));
          S(E.hudUnder, "transform", "translateY(150px)"); S(E.hudUnderR, "transform", "translateY(150px)");
          T(E.hudUnder, "CG · CYCLES · SHADOW CATCHER · ROTO HOLDOUT");
          T(E.hudUnderR, "");
          S(E.hudUnder, "opacity", ramp(F, 175, 181).toFixed(3)); S(E.hudUnderR, "opacity", "0");
        } else {
          S(E.finalBox, "opacity", "0"); S(E.lockTag, "opacity", "0"); S(E.act3, "opacity", "0");
          S(E.hudUnder, "transform", "none"); S(E.hudUnderR, "transform", "none");
        }

        // ---------------------------------------------------------------- ACT 5: BREAKDOWN (f221-274)
        const bands = [E.b1, E.b2, E.b3, E.b4], labs = [E.bl1, E.bl2, E.bl3, E.bl4];
        if (act === 5) {
          const s = Math.min(51, F - 221);
          const fold = F >= 273 ? [0.42, 0.88][F - 273] : 0;
          for (let i = 0; i < 4; i++) {
            const st0 = 221 + 3 * i; const x = W * (1 - eOExpo(ramp(F, st0, st0 + 9)));
            const cy0 = BD_TOP[i] + 452; const dy = (1920 - cy0) * eIC(fold);
            S(bands[i], "opacity", F >= st0 ? "1" : "0");
            S(bands[i], "transform", `translate(${x.toFixed(1)}px,${dy.toFixed(1)}px) scaleY(${(1 - 0.92 * fold).toFixed(3)})`);
            // labels: top-left of each band; band A's sits bottom-left (keeps key text out of the top 250 px)
            const lx = 40 + x, ly = i === 0 ? BD_TOP[0] + 904 - 40 - 66 : BD_TOP[i] + 40;
            S(labs[i], "transform", `translate(${lx.toFixed(1)}px,${(ly + dy).toFixed(1)}px)`);
            S(labs[i], "opacity", (ramp(F, st0 + 4, st0 + 8) * (1 - fold * 1.2)).toFixed(3));
          }
          S(E.bl0, "transform", `translate(${(W - 40 - 520 + W * (1 - eOExpo(ramp(F, 221, 230)))).toFixed(1)}px,${(BD_TOP[0] + 904 - 40 - 66).toFixed(1)}px)`);
          S(E.bl0, "opacity", (ramp(F, 225, 229) * (1 - fold * 1.2)).toFixed(3));
          S(E.b4edge, "opacity", F === 251 ? "1" : "0");
          // band B overlay: tracks + grid + monument wireframe (falls with the CG, s0-s4)
          const x2 = W * (1 - eOExpo(ramp(F, 224, 233)));
          if (F >= 224 && fold === 0) {
            const cam = bandCam(s, x2, BD_TOP[1], KB); const clip = [x2, BD_TOP[1], W, 904];
            drawGrid(cam, 0.9, 46, 3, clip);
            drawTracks(s, x2, BD_TOP[1], KB, 0.9, 1.0, clip);
            const zf = s <= 4 ? 5 * (1 - (s / 4) * (s / 4)) : 0;
            drawWire(cam, 1, zf, 1, clip);
          }
        } else {
          for (let i = 0; i < 4; i++) { S(bands[i], "opacity", "0"); S(labs[i], "opacity", "0"); }
          S(E.bl0, "opacity", "0"); S(E.b4edge, "opacity", "0");
        }

        // ---------------------------------------------------------------- ACT 6: TITLE (f275-374)
        if (act === 6) {
          S(E.title, "opacity", "1");
          const sf = F <= 290 ? lerp(1.06, 1.0, eOC(ramp(F, 275, 290))) : lerp(1.0, 1.03, eIOS(ramp(F, 290, 374)));
          const sb = lerp(1.0, 1.012, ramp(F, 275, 374));
          S(E.tFg, "transform", `scale(${sf.toFixed(5)})`); S(E.tBg, "transform", `scale(${sb.toFixed(5)})`);
          const lg = eOC(ramp(F, 283, 291));
          S(E.logo, "opacity", lg.toFixed(3)); S(E.logo, "transform", `scale(${lerp(1.025, 1, lg).toFixed(4)})`);
          const rl = eOC(ramp(F, 291, 299));
          S(E.tRule, "opacity", F >= 291 ? "1" : "0"); S(E.tRule, "transform", `scaleX(${rl.toFixed(4)})`);
          const ro = eOC(ramp(F, 291, 301));
          S(E.tRole, "opacity", ro.toFixed(3)); S(E.tRole, "transform", `translateY(${lerp(24, 0, ro).toFixed(2)}px)`);
          const so = eOC(ramp(F, 302, 312));
          S(E.tStudio, "opacity", so.toFixed(3)); S(E.tStudio, "transform", `translateY(${lerp(18, 0, so).toFixed(2)}px)`);
        } else S(E.title, "opacity", "0");
        S(E.flash, "opacity", F === 275 ? "0.5" : F === 276 ? "0.25" : "0");

        // grain: seeded offset per frame
        const rnd = mulberry32(F * 7919 + 13);
        S(E.grain, "transform", `translate(${Math.floor(rnd() * 256)}px,${Math.floor(rnd() * 256)}px)`);
      }

      // ---------------- timeline ----------------
      function boot() {
        const drv = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(drv, { t: 15, duration: 15, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      const imgs = Array.from(document.images).map((im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()));
      Promise.all([document.fonts.ready, ...imgs]).then(boot);
    </script>
  </body>
