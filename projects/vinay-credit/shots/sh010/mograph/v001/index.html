        if (t < 8.0) return lerp(0.75, 0.55, sstep(ramp(t, 1.0, 1.6)));
        if (t < T_LOCK) return lerp(0.55, 0.45, sstep(ramp(t, 8.0, 8.8)));
        if (t < T_SLAM) return lerp(0.45, 0.35, sstep(ramp(t, T_LOCK, T_LOCK + 0.4)));
        return lerp(0.9, 0.3, eOutCubic(ramp(t, T_SLAM, 12.8)));
      }

      function render(t) {
        if (!M) return;
        const te = t >= T_FREEZE && t < T_SLAM ? T_FREEZE : t; // the freeze: every motion holds
        const slam = ramp(t, T_SLAM, T_SLAM + 6 / FPS);

        // camera shake on the slam (6 frames, deterministic, decaying)
        const sk = t - T_SLAM;
        let sx = 0, sy = 0;
        if (sk >= 0 && sk < 6 / FPS) {
          const f = Math.floor(sk * FPS); const amp = 12 * (1 - f / 6);
          const SX = [1, -0.8, 0.6, -0.9, 0.5, -0.3], SY = [-0.7, 1, -0.9, 0.4, -0.6, 0.3];
          sx = SX[f] * amp; sy = SY[f] * amp;
        }
        S(E.stage, "transform", `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`);

        // plate
        S(E.plateWrap, "opacity", plateOpacity(te === T_FREEZE ? T_FREEZE : t).toFixed(3));
        S(E.scrim, "opacity", (lerp(0, 0.9, ramp(te, 0.9, 1.4)) * (1 - 0.35 * slam)).toFixed(3));

        // embers: gentle always, a little hotter on the title card
        drawEmbers(te, lerp(0.75, 1.0, ramp(t, T_SLAM, 13.0)) * lerp(0.7, 1, ramp(te, 0, 1.0)));

        // logo: 45% -> slam to 100% on the hit, gold bloom pulse
        const lk = ramp(t, T_HIT - 0.04, T_HIT + 0.08);
        S(E.logo, "opacity", lerp(0.45, 1, lk).toFixed(3));
        let bloom = 0;
        if (t >= T_HIT - 0.04) bloom = Math.max(bloom, 0.75 * Math.exp(-(t - T_HIT) / 0.22) * ramp(t, T_HIT - 0.04, T_HIT));
        if (t >= T_SLAM) bloom = Math.max(bloom, 0.45 * Math.exp(-(t - T_SLAM) / 0.25));
        S(E.bloom, "opacity", bloom.toFixed(3));

        // header
        const hIn = eOutCubic(ramp(t, T_HIT, T_HIT + 0.3));
        const hOut = ramp(t, T_FREEZE, T_SLAM);
        S(E.header, "opacity", (hIn * (1 - hOut)).toFixed(3));
        // "ROUND ONE!" announcer call in the bed (frames 43-66): a single tasteful kick on the header
        const kk = te - 43 / FPS;
        const kick = kk >= 0 ? Math.exp(-kk / 0.16) * (kk < 2 / FPS ? kk / (2 / FPS) : 1) : 0;
        S(E.header, "transform", `translateY(${(30 * (1 - hIn)).toFixed(1)}px) scale(${(1 + 0.045 * kick).toFixed(4)})`);
        S(E.header, "color", kick > 0.02 ? `rgb(${Math.round(lerp(243, 255, kick))},${Math.round(lerp(230, 214, kick))},${Math.round(lerp(214, 150, kick))})` : "#F3E6D6");

        // roll
        const Y0 = y0(te);
        const rollOn = t >= T_HIT ? 1 : 0;
        const sp = te < T_FREEZE ? rowSpeed(te) : 0;
        const mb = Math.min(2, sp * 0.06);
        const lockK = eOutCubic(ramp(te, T_LOCK, T_LOCK + 12 / FPS));
        const rack = lockK * 3;
        E.blurFe.setAttribute("stdDeviation", `${rack.toFixed(2)} ${(rack + mb).toFixed(2)}`);
        S(E.rollOthers, "filter", rack + mb > 0.05 ? "url(#rollBlur)" : "none");
        S(E.rollOthers, "transform", `translateY(${Y0.toFixed(2)}px)`);
        S(E.rollOthers, "opacity", (rollOn * lerp(0.85, 0.22, lockK)).toFixed(3));
        // whip out on the slam
        const wk = eOutCubic(slam); const wf = ramp(t, T_SLAM, T_SLAM + 3 / FPS);
        S(E.rollWhip, "transform", `translateY(${(-600 * wk).toFixed(1)}px)`);
        S(E.rollMask, "opacity", (1 - wf).toFixed(3));
        S(E.rollWhip, "filter", wk > 0 ? `blur(${(8 * wk).toFixed(2)}px)` : "none");

        // hero (his name): rides the roll, then solves, then glides to centre
        const heroY = Y0 + PITCH * HERO_ROW;
        // before lock, it lives inside the roll window -> emulate the roll's soft mask
        const my = heroY;
        const maskA = my < 1180 || my > 3300 ? 0 : Math.min(1, (my - 1180) / 220, (3300 - my) / 220);
        const solveScale = te < T_LOCK ? 1 : lerp(1, 1.28, eOutBack(ramp(te, T_LOCK, T_LOCK + 8 / FPS), 2.2));
        const glide = eInOutCubic(ramp(te, 10.6, 11.4));
        const wNow = M.heroW52 * solveScale;
        const xLeft = lerp(1125 + M.heroW52 * 0.35 - wNow * 0.35, 1080 - wNow / 2, glide); // grow mostly rightward, clear of the left column
        const fs = 52 * solveScale;
        const heroOn = rollOn * (te < T_LOCK ? maskA : 1);
        S(E.hero, "left", xLeft.toFixed(2) + "px");
        S(E.hero, "fontSize", fs.toFixed(2) + "px");
        S(E.hero, "fontWeight", String(Math.round(lerp(500, 700, ramp(te, T_LOCK, T_LOCK + 8 / FPS)))));
        S(E.heroBox, "transform", `translateY(${heroY.toFixed(2)}px)`);
        const gk = ramp(te, T_LOCK, T_LOCK + 3 / FPS);
        S(E.hero, "opacity", (heroOn * lerp(0.85, 1, gk) * (1 - ramp(t, T_SLAM, T_SLAM + 2 / FPS))).toFixed(3));
        S(E.heroGold, "opacity", gk.toFixed(3));
        S(E.heroPlain, "opacity", (1 - gk).toFixed(3));
        const glowPulse = te >= T_LOCK ? 0.35 + 0.45 * Math.exp(-(te - T_LOCK) / 0.35) : 0;
        S(E.heroGlow, "opacity", (gk * glowPulse).toFixed(3));
        const hw = wNow, hh = fs * 1.0;

        // pre-roll search "+" (0 - 1 s): drifts over the fighter, hunting
        const pk = te < T_HIT ? 1 : 0;
        const px = 1080 + Math.sin(te * 2.1) * 180 + Math.sin(te * 5.3) * 40, py = 2050 + Math.cos(te * 1.7) * 120 + Math.sin(te * 4.1) * 30;
        S(E.plus, "transform", `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px) rotate(${(te * 40).toFixed(1)}deg)`);
        S(E.plus, "opacity", (pk * ramp(te, 0.05, 0.3) * 0.9).toFixed(3));

        // trackers
        const trkOut = 1 - wf;
        TRK.forEach((d, n) => {
          const el = trkEls[n];
          const [lbl, row, side, frac, tin, tlost] = d;
          const c = M.cell[lbl];
          let cx = c.x + c.w * frac;
          if (lbl === "TRK_07") cx = 1125 + M.heroW52 * frac; // measured at 52 px before the lock
          const cy = Y0 + PITCH * row;
          const ink = ramp(te, tin, tin + 4 / FPS);
          let sc = lerp(1.3, 1.0, eOutCubic(ink));
          let a = ink;
          let dx = 0, dy = 0, col = "#F5B53C", text = lbl;
          if (te >= tlost) {
            const lk2 = te - tlost;
            col = "#C8161D"; text = lbl + "  LOST";
            const slip = eInCubic(ramp(lk2, 0.04, 0.4));
            dx = (n % 2 ? 1 : -1) * 46 * slip + Math.sin(lk2 * 90) * 4 * (lk2 < 0.2 ? 1 : 0);
            dy = -26 * slip;
            a *= 1 - ramp(lk2, 0.12, 0.42);
          }
          if (lbl === "TRK_07") {
            // at the lock the pattern / search boxes collapse into the brackets
            const ck = ramp(te, T_LOCK, T_LOCK + 3 / FPS);
            a *= 1 - ck; sc *= lerp(1, 0.6, ck);
          }
          a *= trkOut;
          S(el, "opacity", a.toFixed(3));
          S(el, "transform", `translate(${(cx + dx).toFixed(2)}px, ${(cy + dy - 600 * wk).toFixed(2)}px) scale(${sc.toFixed(3)})`);
          if (el.__col !== col) { el.style.setProperty("--c", col); el.__col = col; }
          const lb = el.firstChild.parentNode.querySelector(".lbl");
          if (lb.textContent !== text) lb.textContent = text;
        });

        // TRK_07 solve brackets + label
        const bk = ramp(te, T_LOCK, T_LOCK + 3 / FPS);
        const bOff = 60 * (1 - eOutBack(bk, 2.0));
        const padX = 34, padY = 6;
        const bx = xLeft - padX, by = heroY - hh / 2 - padY, bw = hw + padX * 2, bh = hh + padY * 2;
        S(E.brk, "opacity", (te >= T_LOCK ? Math.min(1, bk * 2) * trkOut : 0).toFixed(3));
        S(E.brk, "transform", `translate(${bx.toFixed(2)}px, ${(by - 600 * wk).toFixed(2)}px)`);
        S(bcs[0], "transform", `translate(${(-bOff).toFixed(2)}px, ${(-bOff).toFixed(2)}px)`);
        S(bcs[1], "transform", `translate(${(bw - 44 + bOff).toFixed(2)}px, ${(-bOff).toFixed(2)}px)`);
        S(bcs[2], "transform", `translate(${(-bOff).toFixed(2)}px, ${(bh - 44 + bOff).toFixed(2)}px)`);
        S(bcs[3], "transform", `translate(${(bw - 44 + bOff).toFixed(2)}px, ${(bh - 44 + bOff).toFixed(2)}px)`);
        const lblK = ramp(te, T_LOCK + 2 / FPS, T_LOCK + 6 / FPS);
        S(E.solved, "opacity", (lblK * trkOut).toFixed(3));
        S(E.solved, "transform", `translate(${(bx).toFixed(2)}px, ${(by + bh + 18 - 600 * wk).toFixed(2)}px)`);

        // gold point-cloud burst off the name at the lock
        drawSparks(te >= T_FREEZE ? -1 : te, 1125 - M.heroW52 * 0.28 * 0.35, M.heroW52 * 1.28, 1920);

        // ---------------- title card ----------------
        const ck2 = t - T_SLAM;
        const n1k = eOutExpo(ramp(ck2, 0, 6 / FPS));
        const n2k = eOutExpo(ramp(ck2, 1 / FPS, 7 / FPS));
        S(E.n1, "opacity", n1k.toFixed(3));
        S(E.n1, "transform", `translateY(${(40 * (1 - n1k)).toFixed(1)}px) scale(${lerp(1.14, 1, n1k).toFixed(4)})`);
        S(E.n1, "filter", n1k < 1 ? `blur(${(10 * (1 - n1k)).toFixed(2)}px)` : "none");
        S(E.n2, "opacity", n2k.toFixed(3));
        S(E.n2, "transform", `translateY(${(-40 * (1 - n2k)).toFixed(1)}px) scale(${lerp(1.14, 1, n2k).toFixed(4)})`);
        S(E.n2, "filter", n2k < 1 ? `blur(${(10 * (1 - n2k)).toFixed(2)}px)` : "none");
        S(E.rule, "transform", `scaleX(${eInOutCubic(ramp(t, 12.45, 12.85)).toFixed(4)})`);
        const rk = eOutCubic(ramp(t, 12.55, 12.95));
        S(E.role, "opacity", rk.toFixed(3));
        S(E.role, "transform", `translateY(${(36 * (1 - rk)).toFixed(1)}px)`);
        const shk = eOutCubic(ramp(t, 12.85, 13.25));
        S(E.show, "opacity", shk.toFixed(3));
        S(E.show, "transform", `translateY(${(30 * (1 - shk)).toFixed(1)}px)`);
        const luk = eOutCubic(ramp(t, T_SLAM, 13.0));
        S(E.lineupBox, "opacity", luk.toFixed(3));
        S(E.lineupBox, "transform", `translateY(${(380 * (1 - luk)).toFixed(1)}px)`);
        const push = lerp(1, 1.03, sstep(ramp(t, 13.0, 15.0)));
        S(E.card, "transform", `scale(${push.toFixed(5)})`);

        // gold flash on the slam (3 frames)
        const fk = t - T_SLAM;
        const fl = fk >= 0 && fk < 4 / FPS ? [0.62, 0.38, 0.16, 0.05][Math.floor(fk * FPS + 1e-6)] : 0;
        S(E.flash, "opacity", fl.toFixed(3));
      }

      // ---------------- timeline: one driver, every visual a pure function of t ----------------
      function build() {
        measure();
        const tl = gsap.timeline({ paused: true });
        const drv = { t: 0 };
        tl.to(drv, { t: 15, duration: 15, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      document.fonts.ready.then(build);
    </script>
  </body>
</html>
